name: Port dependency scan
run-name: Dependency scan / Port ${{ inputs.port_run_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Target repository (owner/name)
        type: string
        required: true
      minimum_severity:
        description: Minimum advisory severity to publish
        type: choice
        options: [low, moderate, high, critical]
        default: high
      port_run_id:
        description: Optional Port run identifier for correlation
        type: string

permissions: {}

concurrency:
  group: port-dependency-scan-${{ inputs.target_repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.target.outputs.owner }}
      repo: ${{ steps.target.outputs.repo }}
    steps:
      - name: Validate target repository
        id: target
        shell: bash
        env:
          TARGET: ${{ inputs.target_repository }}
        run: |
          [[ "$TARGET" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          echo "owner=${TARGET%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${TARGET#*/}" >> "$GITHUB_OUTPUT"
  scan:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Create target repository token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SECURITY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SECURITY_APP_PRIVATE_KEY }}
          owner: ${{ needs.prepare.outputs.owner }}
          repositories: ${{ needs.prepare.outputs.repo }}
          permission-contents: read
      - name: Check out target repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.target_repository }}
          token: ${{ steps.app.outputs.token }}
          path: target-source
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run dependency audit
        shell: bash
        run: |
          mkdir audit-results
          count=0
          while IFS= read -r -d '' lockfile; do
            [[ -f "target-source/$lockfile" && ! -L "target-source/$lockfile" ]]
            directory=$(dirname -- "$lockfile")
            count=$((count + 1))
            status=0
            (cd "target-source/$directory" && npm audit --json --package-lock-only --ignore-scripts --audit-level=low) > "audit-results/$count.json" || status=$?
            if [ "$status" -gt 1 ]; then exit "$status"; fi
            node .github/scripts/publish-findings.mjs --validate "audit-results/$count.json"
            printf '%s' "$lockfile" > "audit-results/$count.lockfile"
          done < <(git -C target-source ls-files -z -- 'package-lock.json' ':(glob)**/package-lock.json')
          if [[ "$count" -eq 0 ]]; then
            echo "::error::No committed npm package-lock.json found in the target repository."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: audit-results
          retention-days: 1

  publish:
    needs: [prepare, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm-audit
          path: audit-results
      - name: Create target repository token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SECURITY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SECURITY_APP_PRIVATE_KEY }}
          owner: ${{ needs.prepare.outputs.owner }}
          repositories: ${{ needs.prepare.outputs.repo }}
          permission-issues: write
      - name: Publish findings and skip reviewed false positives
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          MINIMUM_SEVERITY: ${{ inputs.minimum_severity }}
        run: |
          TARGET_REPOSITORY_ID=$(gh api "repos/$TARGET_REPOSITORY" --jq .id)
          export TARGET_REPOSITORY_ID
          for report in audit-results/*.json; do
            AUDIT_LOCKFILE=$(cat "${report%.json}.lockfile")
            export AUDIT_LOCKFILE
            node .github/scripts/publish-findings.mjs "$report"
          done
